<form method="post" action="{% url 'authentication:login' %}" class="space-y-4">
    {% csrf_token %}

    {% if form.non_field_errors %}
    <div class="bg-rose-950/80 border border-rose-800 text-rose-300 px-4 py-2.5 rounded-lg text-xs">
        {{ form.non_field_errors.0 }}
    </div>
    {% endif %}

    <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
        <input type="text" name="username" autofocus required
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
               placeholder="Enter your username">
        {% if form.username.errors %}
            <p class="text-xs text-rose-400 mt-1">{{ form.username.errors.0 }}</p>
        {% endif %}
    </div>

    <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
        <input type="password" name="password" required
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
               placeholder="••••••••">
        {% if form.password.errors %}
            <p class="text-xs text-rose-400 mt-1">{{ form.password.errors.0 }}</p>
        {% endif %}
    </div>

    <button type="submit"
            class="w-full mt-2 py-2.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-lg text-sm font-semibold shadow-lg shadow-emerald-950/50 transition">
        Sign In
    </button>
</form>
