<!-- Single Reusable Monitor Modal -->
<div id="monitorModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-cardBg border border-borderBg rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
        <div class="px-6 py-4 border-b border-borderBg flex items-center justify-between">
            <h3 id="modalTitle" class="text-base font-semibold text-white flex items-center gap-2">
                <span>➕</span> Add New Target Endpoint
            </h3>
            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
        </div>

        <form id="monitorForm" method="post" action="{% url 'monitors:monitor-create' %}" class="p-6 space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Friendly Name</label>
                <input type="text" name="name" id="field_name" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                       placeholder="e.g. Production Billing API">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Target URL</label>
                <input type="url" name="url" id="field_url" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                       placeholder="https://api.example.com/healthz">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">HTTP Method</label>
                    <select name="http_method" id="field_http_method"
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="HEAD">HEAD</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Expected Code</label>
                    <input type="number" name="expected_status_code" id="field_expected_status_code" value="200" min="100" max="599" required
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Interval (Sec)</label>
                    <input type="number" name="interval_seconds" id="field_interval_seconds" value="60" min="30" required
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Timeout (Sec)</label>
                    <input type="number" name="timeout_seconds" id="field_timeout_seconds" value="10" min="1" max="60" required
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div class="pt-2">
                <label class="inline-flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
                    <input type="checkbox" name="is_active" id="field_is_active" value="true" checked
                           class="rounded bg-slate-900 border-slate-700 text-emerald-500 focus:ring-0">
                    <span>Active monitoring enabled</span>
                </label>
            </div>

            <div class="pt-4 flex items-center justify-end space-x-3 border-t border-slate-800">
                <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-medium text-slate-400 hover:text-white transition">Cancel</button>
                <button type="submit" id="modalSubmitBtn" class="px-5 py-2 text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition shadow-md">
                    Create Target
                </button>
            </div>
        </form>
    </div>
</div>
