services:
  
  db:
    image: postgres:17
    container_name: aegis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aegis_network
  

  

  

  migrate:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    container_name: aegis_migrate
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      
      DB_HOST: db
      
      
    volumes:
      - static_data:/app/staticfiles
      
    
    depends_on:
      
      
      db:
        condition: service_healthy
      
    
    networks:
      - aegis_network

  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    container_name: aegis_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      
      DB_HOST: db
      
      
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      
    command: gunicorn --bind 0.0.0.0:8000 config.wsgi:application
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - aegis_network

  nginx:
    image: nginx:1.29-alpine
    container_name: aegis_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - aegis_network

  
  
  broker:
    image: redis:7-alpine
    container_name: aegis_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - aegis_network
  

  worker:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    command: celery -A config worker -l info
    container_name: aegis_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: "false"
      RUN_COLLECTSTATIC: "false"
      
      DB_HOST: db
      
      
    volumes:
      - media_data:/app/media
      
    
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    
    networks:
      - aegis_network

  flower:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    command: celery -A config flower --address=0.0.0.0 --port=5555 --basic-auth=${FLOWER_BASIC_AUTH:?Set FLOWER_BASIC_AUTH in .env} --persistent=True --db=/data/flower.db
    container_name: aegis_flower
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: "false"
      RUN_COLLECTSTATIC: "false"
      
      DB_HOST: db
      
      
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - flower_data:/data
    depends_on:
      broker:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - aegis_network
  

volumes:
  
  postgres_data:
  
  static_data:
  media_data:
  nginx_logs:
  
  flower_data:
  
  

networks:
  aegis_network:
    driver: bridge
