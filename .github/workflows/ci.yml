name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Linters and Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_aegis_db
          POSTGRES_USER: aegis_user
          POSTGRES_PASSWORD: aegis_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/develop.txt

      - name: Run Flake8 Linter
        run: |
          flake8 apps/ config/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Test Suite
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DB_NAME: test_aegis_db
          DB_USER: aegis_user
          DB_PASSWORD: aegis_password
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
          SECRET_KEY: test-secret-key-for-continuous-integration-pipeline
        run: |
          pytest apps/monitors/tests/