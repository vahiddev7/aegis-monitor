services:
  db:
    image: postgres:17
    container_name: aegis_dev_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - aegis_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aegis_dev_network

  broker:
    image: redis:7-alpine
    container_name: aegis_dev_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aegis_dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - aegis_dev_network

volumes:
  aegis_dev_postgres_data:
  aegis_dev_redis_data:

networks:
  aegis_dev_network:
    driver: bridge